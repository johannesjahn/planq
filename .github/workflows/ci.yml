name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: both jobs only read the checked-out code. CI runs
# `bun install` and project tooling on pull_request events (including from
# forks), so the token handed to that dependency tree must not be able to write.
# Grant anything extra per-job, only where a step actually needs it.
permissions:
  contents: read

env:
  # Kept in step with the `oven/bun` base image in the Dockerfile so CI validates
  # a commit on the same runtime production runs — Bun is the transpiler, the
  # test runner, the SQLite driver and the password hasher here, not a peripheral
  # tool. Renovate bumps this line and the Dockerfile together (see renovate.json).
  # renovate: datasource=docker depName=oven/bun
  BUN_VERSION: "1.3.14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      # `web/api.json` is generated from the HttpApi definition and committed, so a
      # backend change that forgets to regenerate it must fail here rather than
      # silently leaving the frontend types describing the old contract.
      - name: Check web/api.json is up to date
        run: |
          bun run openapi:generate
          git diff --exit-code web/api.json

      # `drizzle/` is generated from src/db/schema.ts and committed, and it is what
      # the server actually runs at startup. A schema change that forgets
      # `bun run db:generate` would leave the two describing different tables, so
      # regenerate and fail if that produces anything (a new migration file, or a
      # rewritten snapshot).
      - name: Check drizzle migrations are up to date
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "src/db/schema.ts and drizzle/ are out of sync — run 'bun run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run lint

      - run: bun run build

      # The generated client must match the committed spec for the same reason.
      - name: Check generated API types are up to date
        run: |
          bun run api:types
          git diff --exit-code src/lib/api.gen.ts
